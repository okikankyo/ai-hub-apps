domain: Utilities
headline: A playful mascot-based launcher app for iOS
description: >
  Cat Mascot Launcher is an interactive iOS app featuring a cute cat mascot that reacts to your interactions.
  Customize quick-launch shortcuts to your favorite apps, websites, and services. Add the widget to your home screen
  or lock screen for instant access. Share state between the main app and widget via App Groups, and use the
  `catlauncher://` URL scheme to trigger moods and shortcuts from Shortcuts app or Safari.
app_type: ios
