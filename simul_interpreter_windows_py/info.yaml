name: Simultaneous Interpreter
id: simul_interpreter_windows_py
license_url: https://github.com/qualcomm/ai-hub-apps/blob/main/LICENSE
license_type: bsd-3-clause
runtime: precompiled_qnn_onnx
status: published
domain: 'Audio'
headline: 'Real-time face-to-face speech interpretation for dual-display Snapdragon PCs'
description: "Demonstrates on-device, real-time speech-to-speech interpretation between Japanese and English for face-to-face use (e.g. tourism), using Whisper for speech recognition and a Genie SDK LLM for translation, leveraging the Snapdragon® Neural Processing Unit (NPU). Designed for a two-screen setup: one display faces the Japanese speaker, the other faces the foreign guest."
precisions: [float]
app_type: 'windows'
static_img_filename: 'app_screen.png'
app_repo_relative_path: 'simul_interpreter_windows_py'
os:
  name: Windows
  version: 11+
languages: ['Python']
use_case: 'Speech Recognition'
related_models: [whisper_base]
model_file_paths:
  - 'models/whisper/encoder.onnx'
  - 'models/whisper/decoder.onnx'
  - 'models/llm/*.bin'
skip_test: infra doesn't support building python app. CLI will fix https://github.com/qcom-ai-hub/tetracode/issues/17462
